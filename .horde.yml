---
id: Service_Facebook
name: Service_Facebook
full: Facebook Graph API client library
description: >
  A modern PSR-4 client for Facebook's Graph API. Targets Graph v25 by
  default with active support for a rolling window of prior versions.
  Integrates with horde/oauth for OAuth2/OIDC flows and horde/jwt for
  id_token verification.
list: dev
type: library
homepage: https://www.horde.org/libraries/Horde_Service_Facebook
authors:
  - name: Ralf Lang
    user: rlang
    email: ralf.lang@ralf-lang.de
    active: true
    role: lead
  - name: Michael J Rubinsky
    user: mrubinsk
    email: mrubinsk@horde.org
    active: false
    role: lead
version:
  release: 3.0.0alpha2
  api: 3.0.0
state:
  release: alpha
  api: unstable
license:
  identifier: BSD-2-Clause
  uri: http://www.horde.org/licenses/bsd
dependencies:
  required:
    php: ^8.1
    composer:
      psr/http-client: ^1.0
      psr/http-factory: ^1.0
      psr/http-message: ^2.0
      horde/oauth: ^4
      horde/jwt: ^1
      horde/exception: ^3
keywords:
  - facebook
  - graph
  - oauth2
  - oidc
  - meta
vendor: horde
quality:
  phpstan:
    level: 5
ci-platform:
  '8.1':
    - php: ^8.1
    - ext-json
    - ext-hash
    - ext-openssl
  '8.2':
    - php: ^8.1
    - ext-json
    - ext-hash
    - ext-openssl
  '8.3':
    - php: ^8.1
    - ext-json
    - ext-hash
    - ext-openssl
  '8.4':
    - php: ^8.1
    - ext-json
    - ext-hash
    - ext-openssl
  '8.5':
    - php: ^8.1
    - ext-json
    - ext-hash
    - ext-openssl
  '8.6':
    - php: ^8.1
    - ext-json
    - ext-hash
    - ext-openssl
ci-platform-flags:
  needs_installer_plugin: false
